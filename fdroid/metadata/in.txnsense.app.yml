AuthorName: CommitAndQuit
Summary: Offline expense tracker driven by incoming financial SMS alerts

Description: |-
  TxnSense is an offline, privacy-first Android expense tracker that records
  transactions from incoming financial SMS and lets you organize, track, and
  manage your spending locally.

  Features:
  * 100% Offline: Zero Internet permission (android.permission.INTERNET is not requested).
  * Encrypted On-Device Storage: SQLCipher encrypted database with keys protected via Android Keystore.
  * Fast Deterministic SMS Parsing: Recognizes ~90+ bank formats without external network calls.
  * Spend & Income Tracking: Net spend per payment method, spend vs income totals, and monthly analytics.
  * Review Queue: Flags uncertain amounts or unfamiliar message layouts for manual verification.

