# F-Droid repository configuration for TxnSense
# This is a self-hosted binary repository. APKs are built and signed by the
# GitHub release workflow, then indexed here and published through GitHub Pages.

repo_url: https://commitandquit.github.io/txn-sense/fdroid/repo
repo_name: TxnSense Alpha
repo_description: "Official self-hosted repository for TxnSense expense tracker alpha builds."
repo_icon: icon.png

# Repository signing key. The keystore is restored from
# FDROID_KEYSTORE_BASE64 by the GitHub Actions workflow and must contain the
# repo_key alias. Passwords are injected from repository secrets at runtime.
keystore: keystore.p12
repo_keyalias: repo_key
keystorepass: {env: FDROID_STORE_PASSWORD}
keypass: {env: FDROID_STORE_PASSWORD}

# Keep all versions in the main repository and do not maintain an archive.
archive_older: 0
