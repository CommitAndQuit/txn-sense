name: Release Signed Alpha APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Audit public tree
        run: python3 tools/verify_public_tree.py

      - name: Prepare next alpha version
        id: version
        run: |
          set -euo pipefail
          python3 tools/prepare_release.py --github-output "$GITHUB_OUTPUT"
          version=$(sed -n 's/^versionName=//p' android-app/version.properties | tr -d '\r')
          code=$(sed -n 's/^versionCode=//p' android-app/version.properties | tr -d '\r')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          [[ "$code" =~ ^[1-9][0-9]*$ ]]
          (( code <= 2100000000 ))
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists. Refusing to reuse a release version." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          echo "sdk.dir=$sdk" >> android-app/local.properties

      - name: Decode persistent alpha signing key
        env:
          ALPHA_KEYSTORE_BASE64: ${{ secrets.ALPHA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ALPHA_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ALPHA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/finance-alpha.p12"

      - name: Build signed debug alpha and run checks
        working-directory: android-app
        env:
          FM_REQUIRE_ALPHA_SIGNING: 'true'
          FM_ALPHA_KEYSTORE: ${{ runner.temp }}/finance-alpha.p12
          FM_ALPHA_STORE_PASSWORD: ${{ secrets.ALPHA_STORE_PASSWORD }}
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug

      - name: Package APK, notices, checksum and certificate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "dist/txnsense-$VERSION-debug.apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          "$sdk/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/txnsense-$VERSION-debug.apk" > dist/SIGNING-CERTIFICATE.txt
          cp LICENSE dist/LICENSE.txt
          cp docs/THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          cp android-app/app/src/main/assets/licenses/* dist/
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Commit release metadata
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/version.properties CHANGELOG.md \
            fdroid/metadata/in.txnsense.app.yml \
            "fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          git commit -m "chore(release): $VERSION [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create published pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          changes=$(awk -v heading="## $VERSION" '$0 == heading { collecting=1; next } collecting && /^## / { exit } collecting { print }' CHANGELOG.md)
          test -n "$changes"
          printf '%s\n' "Debug alpha $VERSION for testing; not ready for general use." '' \
            "$changes" '' \
            'Earlier GitHub debug installs used ephemeral CI signing keys. Uninstall the old build once before installing this APK; uninstalling deletes the local ledger. Future releases will update in place.' '' \
            'Download the APK asset from this release. See the README for setup and permission instructions.' '' \
            "Source commit: $TARGET_SHA" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" dist/* --target "$TARGET_SHA" --title "TxnSense $VERSION (debug alpha)" \
            --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Dispatch F-Droid repository deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run fdroid-repo.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$TAG"

      - name: Remove temporary signing file
        if: always()
        run: rm -f -- "$RUNNER_TEMP/finance-alpha.p12"
