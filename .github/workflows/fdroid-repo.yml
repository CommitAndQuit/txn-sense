name: Deploy F-Droid Repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (defaults to the latest release)'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager 'build-tools;36.0.0'

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver

      - name: Fetch release APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$RELEASE_TAG}"
          if [ -z "$tag" ]; then
            tag=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          fi
          test -n "$tag"
          echo "Downloading APK from release $tag"
          mkdir -p fdroid/repo
          gh release download "$tag" --pattern "*.apk" --dir fdroid/repo
          apk=$(find fdroid/repo -maxdepth 1 -name '*.apk' | head -1)
          test -n "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          "$sdk/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q "package: name='in.txnsense.app'"
          echo "Downloaded $(basename "$apk")"

      - name: Configure repository keystore and icon
        env:
          KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.FDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASS" ]; then
            echo "::error::FDROID_KEYSTORE_BASE64 and FDROID_STORE_PASSWORD must be configured."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > fdroid/keystore.p12
          mkdir -p fdroid/repo/icons
          cp fdroid/icon.png fdroid/repo/icons/icon.png

      - name: Generate repository index
        working-directory: fdroid
        env:
          FDROID_STORE_PASSWORD: ${{ secrets.FDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          fdroid update --pretty
          ls -la repo/

      - name: Stage Pages artifact
        env:
          FDROID_STORE_PASSWORD: ${{ secrets.FDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p pages/fdroid
          cp -r fdroid/repo pages/fdroid/

          fingerprint=$(keytool -list -v -keystore fdroid/keystore.p12 -alias repo_key \
            -storepass:env FDROID_STORE_PASSWORD 2>/dev/null \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          query=""
          if [ -n "$fingerprint" ]; then
            query="?fingerprint=$fingerprint"
          fi

          cat << EOF > pages/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>TxnSense - F-Droid Repository</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; max-width: 650px; margin: 40px auto; padding: 0 20px; color: #222; }
              h1 { color: #176B60; }
              .btn { display: inline-block; background: #176B60; color: #fff; padding: 12px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin: 15px 0; }
              .btn:hover { background: #12554c; }
              code { background: #f4f4f4; padding: 3px 6px; border-radius: 4px; font-size: 0.9em; word-break: break-all; }
              .box { background: #f9f9f9; border-left: 4px solid #176B60; padding: 15px; margin: 20px 0; }
            </style>
          </head>
          <body>
            <h1>TxnSense F-Droid Repository</h1>
            <p>This is the official self-hosted F-Droid repository for <strong>TxnSense</strong>, an offline, privacy-first Android expense tracker.</p>

            <a class="btn" href="fdroidrepos://commitandquit.github.io/txn-sense/fdroid/repo${query}">Add to F-Droid</a>

            <div class="box">
              <h3>Manual Setup</h3>
              <ol>
                <li>Open the <strong>F-Droid</strong> app on your Android device.</li>
                <li>Go to <strong>Settings → Repositories</strong>.</li>
                <li>Tap <strong>+</strong> and enter the repository address:
                  <br><code>https://commitandquit.github.io/txn-sense/fdroid/repo</code>
                </li>
                <li>Verify and accept the repository key fingerprint.</li>
              </ol>
              <p><strong>Repository fingerprint:</strong> <code>${fingerprint:-see the F-Droid client prompt}</code></p>
            </div>

            <p><a href="https://github.com/CommitAndQuit/txn-sense">View TxnSense on GitHub</a></p>
          </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy-pages:
    needs: build-repo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
